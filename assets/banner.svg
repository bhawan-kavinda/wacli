<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">wacli</title>
  <desc id="d">wacli: WhatsApp from your terminal. A chat running inside a terminal window.</desc>
  <defs>
    <radialGradient id="glow" cx="0.76" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#00A884" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#00A884" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="win">
      <rect x="690" y="44" width="540" height="312" rx="14"/>
    </clipPath>
  </defs>
  <style>
    .m { font-family: 'JetBrains Mono','Fira Code','DejaVu Sans Mono',Menlo,Consolas,'Courier New',monospace; }
    .s { font-family: 'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif; }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    .cur { animation: blink 1.1s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce) { .cur { animation: none; } }
  </style>

  <!-- background -->
  <rect width="1280" height="400" fill="#081014"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- left: name + tagline -->
  <text class="m" x="72" y="196" font-size="112" font-weight="700" fill="#E9EDEF" textLength="336" lengthAdjust="spacing">wacli</text>
  <rect class="cur" x="424" y="118" width="50" height="84" fill="#00A884"/>
  <text class="s" x="76" y="256" font-size="32" font-weight="600" fill="#E9EDEF">WhatsApp, from your terminal.</text>
  <text class="s" x="76" y="296" font-size="20" fill="#8696A0">Read, reply and send files right from Termux.</text>
  <text class="s" x="76" y="352" font-size="15" fill="#6F808A">Unofficial client, built on whatsmeow</text>

  <!-- right: the TUI -->
  <rect x="690" y="44" width="540" height="312" rx="14" fill="#0B141A" stroke="#202C33" stroke-width="2"/>
  <g clip-path="url(#win)">
    <!-- title bar -->
    <rect x="690" y="44" width="540" height="38" fill="#202C33"/>
    <text class="m" x="712" y="68" font-size="14" fill="#8696A0">wacli</text>

    <!-- chat list -->
    <line x1="840" y1="82" x2="840" y2="356" stroke="#202C33" stroke-width="2"/>
    <text class="m" x="708" y="112" font-size="14" font-weight="700" fill="#00A884">Chats</text>
    <rect x="708" y="120" width="42" height="2" fill="#00A884"/>
    <text class="m" x="764" y="112" font-size="14" fill="#8696A0">Groups</text>

    <rect x="698" y="134" width="134" height="36" rx="8" fill="#2A3942"/>
    <text class="m" x="712" y="157" font-size="15" fill="#E9EDEF">mom</text>

    <text class="m" x="712" y="195" font-size="15" fill="#8696A0">work</text>
    <circle cx="814" cy="190" r="9" fill="#00A884"/>
    <text class="m" x="814" y="194" font-size="11" font-weight="700" fill="#0B141A" text-anchor="middle">2</text>

    <text class="m" x="712" y="233" font-size="15" fill="#8696A0">dev group</text>

    <!-- chat header -->
    <rect x="841" y="82" width="389" height="34" fill="#202C33"/>
    <text class="m" x="858" y="104" font-size="14" font-weight="700" fill="#E9EDEF">mom</text>
    <text class="m" x="898" y="104" font-size="12" fill="#00A884">online</text>

    <!-- messages -->
    <rect x="858" y="134" width="136" height="36" rx="10" fill="#202C33"/>
    <text class="m" x="872" y="157" font-size="15" fill="#E9EDEF">dinner at 8?</text>

    <rect x="992" y="182" width="220" height="36" rx="10" fill="#005C4B"/>
    <text class="m" x="1006" y="205" font-size="15" fill="#E9EDEF">yes, see you there</text>
    <text class="m" x="1198" y="205" font-size="13" fill="#53BDEB" text-anchor="end">✓✓</text>

    <rect x="858" y="230" width="181" height="36" rx="10" fill="#202C33"/>
    <text class="m" x="872" y="253" font-size="15" fill="#E9EDEF">send me the photo</text>

    <!-- input -->
    <rect x="858" y="300" width="354" height="36" rx="10" fill="#202C33"/>
    <text class="m" x="872" y="323" font-size="15" fill="#E9EDEF"><tspan fill="#00A884">&gt;</tspan> /file ~/pic.jpg</text>
    <rect class="cur" x="1028" y="309" width="9" height="20" fill="#00A884"/>
  </g>
</svg>
